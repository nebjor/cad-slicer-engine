server:
  port: 8080

spring:
  application:
    name: cad-slicer-engine
  threads:
    virtual:
      enabled: true # Enable Java 21 Virtual Threads for Spring tasks
  # SMTP account for the order mails. Host, username and password come from the environment
  # (SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD); without a host no sender
  # bean exists and notifications must stay disabled.
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  # Every credential comes from the environment; the defaults only match the local Compose stack.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slicercore}
    username: ${DB_USERNAME:sliceruser}
    password: ${DB_PASSWORD:slicerpassword}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Custom Application Config
slicer:
  # Headless slicing needs no X server, see docs/feasibility/bambu-studio-cli-headless.md (V1)
  binary-path: ${SLICER_BINARY_PATH:bambu-studio-cli}
  timeout-seconds: 120
  # The manifold check (--info) after each slice is best effort; a slow or failing call
  # only loses the information, never the quote.
  info-timeout-seconds: 20
  # Profiles bundled inside the extracted Bambu Studio AppImage
  profiles-dir: "/opt/bambu/squashfs-root/resources/profiles/BBL"
  machine-profile: "Bambu Lab A1 0.4 nozzle"
  # Build plate used for validation; the Cool Plate default rejects PETG.
  bed-type: "Textured PEI Plate"
  # Quote with automatic tree supports, exactly as the parts are printed. Models without
  # overhangs get no supports and keep their price.
  enable-support: true
  # Every run is a CPU-bound native process; bound them so a burst cannot exhaust the host.
  capacity:
    max-concurrent: 2
    queue-wait-seconds: 20

# Per-client limits on slicer starts. Cache hits are free. State is in-memory: a restart resets it.
rate-limit:
  enabled: true
  per-minute: 10
  per-hour: 100
  # Only enable behind a reverse proxy that overwrites X-Forwarded-For (Caddy in production).
  trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
  support-email: ${SUPPORT_EMAIL:}

# Owner login for /api/admin/** (HTTP Basic over TLS). A blank password disables the admin API.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}

# What the print farm stocks (from the supplier invoices, 2026-10). Colour does not change
# the slice; a colour may carry its own material price (price-per-kg-chf), otherwise the
# filament's price below applies. A back-office will replace this block later.
# Purchase prices 2026-10 per kg: PolyTerra matte 14.82, Bambu PLA Basic 25.50, PLA Silk 27.50.
catalog:
  colors:
    PLA:
      - { code: black, label: Charcoal Black (matt), hex: "#2b2b2b" }
      - { code: white, label: Cotton White (matt), hex: "#f1ede3" }
      - { code: gold, label: Gold, hex: "#d4a017", price-per-kg-chf: 45.00 }
      - { code: green, label: Green, hex: "#1f9d4a", price-per-kg-chf: 45.00 }
      - { code: red, label: Red, hex: "#d62828", price-per-kg-chf: 45.00 }
      - { code: blue, label: Blue, hex: "#1f4fd6", price-per-kg-chf: 45.00 }
      - { code: silk-neon-city, label: Silk Neon City (pink / violet / blue), hex: "#c94fb4", price-per-kg-chf: 48.00 }
      - { code: silk-blue-hawaii, label: Silk Blue Hawaii (cyan / green), hex: "#35b8c6", price-per-kg-chf: 48.00 }
    PETG:
      - { code: black, label: Black, hex: "#1f1f1f" }
      - { code: white, label: White, hex: "#f2f2f2" }
    PCTG:
      - { code: transparent, label: Transparent, hex: "#dde8ef" }

# Pricing inputs for /api/quotes. Mass is derived from filament length x density. One copy
# is sliced per model and quality with the PLA profile; every quantity (ADR 0006) and every
# other filament (ADR 0007) is arithmetic on top.
quote:
  currency: CHF
  setup-fee-chf: 5.00
  machine-rate-chf-per-hour: 4.00
  min-unit-price-chf: 3.00
  print-hours-per-day: 16
  filament-diameter-mm: 1.75
  # The quantity never reaches the slicer, so this bounds the order size, not the request cost.
  max-quantity: 100
  # Print time a plate carries once (heating, purge line, first layer). Measured on the
  # production server 2026-10-21 with the Benchy: 2438 s for one copy, 2121 to 2151 s per
  # copy at 4 to 20 copies, so about 300 s is fixed per plate; material is linear.
  plate-overhead-seconds: 300
  # Bed of the A1 and how the slicer's arrange packs parts on it: an edge margin kept free
  # and a gap between parts. 60 x 31 mm Benchys fit 15 per plate, as the slicer arranges them.
  plate:
    width-mm: 256
    depth-mm: 256
    margin-mm: 10
    gap-mm: 15
  # Uploads kept for re-quotes by id (POST /api/models), so changing filament or quality does
  # not send the file again. Blank dir = a temp directory; least recently used models make room.
  model-store:
    dir: ${MODEL_STORE_DIR:}
    ttl-minutes: 60
    max-megabytes: 512
  # Single-copy slices keyed by model hash and quality; a filament, colour or quantity change
  # is priced from the cached slice without running the slicer.
  cache:
    max-entries: 256
    ttl-minutes: 60
  # Customer price per kilogram: purchase price incl. supplier shipping, waste and margin.
  # Purchase prices 2026-10: PolyTerra PLA 14.82, Bambu PLA Basic 25.50, PLA Silk 27.50,
  # PolyLite PETG 29.50, Fiberlogy PCTG 25.81 to 36.67 (CHF/kg, before shipping).
  material-price-chf-per-kg:
    PLA: 36.00
    PETG: 45.00
    PCTG: 55.00
  # How each filament scales the PLA slice before the quantity arithmetic (ADR 0007). Measured
  # on the production server 2026-10-21 with the Benchy, one copy, A1 profiles with tree
  # supports, at 0.24 / 0.20 / 0.12 mm:
  #   print time  PLA 2170 / 2442 / 3686 s, PETG 2934 / 3341 / 5263 s, PCTG 3218 / 3570 / 5547 s
  #   length      PLA 4339 / 4169 / 4065 mm, PETG and PCTG 4207 / 4042 / 3941 mm
  # Time ratios to PLA: PETG 1.35 / 1.37 / 1.43, PCTG 1.48 / 1.46 / 1.50; the means are used.
  # Length ratio: 0.97 for both at every quality (same flow profile). A filament without an
  # entry is priced like PLA (factor 1.0, warned at startup). Re-measure when a profile
  # changes: scripts/measure-slice.sh -F PETG against the PLA run of the same model.
  material:
    time-factor:
      PLA: 1.0
      PETG: 1.38
      PCTG: 1.48
    length-factor:
      PLA: 1.0
      PETG: 0.97
      PCTG: 0.97

# Slice calibration (ADR 0008). Every slice the quote path performs anyway is recorded as one
# row (PLA, one copy, any quality); nothing is re-sliced on its own. The owner can queue an
# order item or an upload-store model by hand (POST /api/admin/calibration/queue/...) for the
# full matrix: every filament at every quality plus two real batches of PLA at standard
# quality (4 and 10 copies), eleven slicer runs per model, one slot at a time so quotes keep
# the other. The report (GET /api/admin/calibration/report) compares the measured ratios with
# the material factors and the plate overhead above; adjust those by hand when the medians drift.
calibration:
  # Off by default: the queue is worked through at night only when this is true. The owner's
  # POST /api/admin/calibration/run-now starts a pass regardless; quote slices are recorded regardless.
  enabled: false
  # The retention sweep runs at 03:30; a pass of five models takes about half an hour.
  cron: "0 0 3 * * *"
  max-models-per-night: 5
  # Copies of models queued from the upload store, so their expiry does not lose them.
  dir: ${CALIBRATION_DIR:./data/calibration}

# Commercial settings for orders. Money is stored on the order when it is placed; changing
# these values affects new orders only.
orders:
  shipping-flat-chf: 9.00
  # The business is not VAT registered yet; switch on and prices are treated as VAT inclusive.
  vat-enabled: false
  vat-rate: 0.081
  quote-validity-days: 14
  retention-days: 90
  # Nightly sweep that erases model files and personal data once retention has ended.
  retention-cron: "0 30 3 * * *"
  files-dir: ${ORDER_FILES_DIR:./data/order-files}
  ship-to-countries: [CH]

# API contract. The JSON spec is always on; the browsable UI can be switched off in production.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api-docs
    enabled: ${SWAGGER_UI_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
  packages-to-scan: com.slicercore

# Order mails: confirmation and shipping notice to the customer, a copy of each paid order to
# the owner. Off by default; then the texts are logged instead of sent.
notifications:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:info@3dburg.ch}
  owner-email: ${OWNER_EMAIL:}
  shop-name: 3DBurg
  shop-url: ${PUBLIC_BASE_URL:http://localhost:4200}

# Customer accounts with passwordless login (ADR 0005): a one-time link by mail opens a
# session held in the pod_session cookie. No new environment variable is needed in production.
account:
  # The cookie's Secure flag. Chrome and Firefox accept Secure cookies on http://localhost; set
  # ACCOUNT_COOKIE_SECURE=false only for a local stack served over plain HTTP on another host.
  cookie-secure: ${ACCOUNT_COOKIE_SECURE:true}
  # A login link works once, within this many minutes.
  login-link-minutes: 15
  # A session lasts this long from its last use (extended at most once a day).
  session-days: 30
  # Links per address within the link validity, and per client address within an hour; beyond
  # that the request is still answered with 202 but no mail is sent. In-memory, like rate-limit.
  login-links-per-email: 3
  login-links-per-client-per-hour: 10

# Hosted payment. "mock" simulates the redirect-and-confirm flow inside the shop; "stripe" uses
# Stripe Checkout and needs both keys, otherwise the application refuses to start.
payments:
  provider: ${PAYMENT_PROVIDER:mock}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
