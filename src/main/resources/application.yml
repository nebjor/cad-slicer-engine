server:
  port: 8080

spring:
  application:
    name: cad-slicer-engine
  threads:
    virtual:
      enabled: true # Enable Java 21 Virtual Threads for Spring tasks
  # SMTP account for the order mails. Host, username and password come from the environment
  # (SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD); without a host no sender
  # bean exists and notifications must stay disabled.
  mail:
    port: ${SPRING_MAIL_PORT:587}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  # Every credential comes from the environment; the defaults only match the local Compose stack.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slicercore}
    username: ${DB_USERNAME:sliceruser}
    password: ${DB_PASSWORD:slicerpassword}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Custom Application Config
slicer:
  # Headless slicing needs no X server, see docs/feasibility/bambu-studio-cli-headless.md (V1)
  binary-path: ${SLICER_BINARY_PATH:bambu-studio-cli}
  timeout-seconds: 120
  # Profiles bundled inside the extracted Bambu Studio AppImage
  profiles-dir: "/opt/bambu/squashfs-root/resources/profiles/BBL"
  machine-profile: "Bambu Lab A1 0.4 nozzle"
  # Build plate used for validation; the Cool Plate default rejects PETG.
  bed-type: "Textured PEI Plate"
  # Quote with automatic tree supports, exactly as the parts are printed. Models without
  # overhangs get no supports and keep their price.
  enable-support: true
  # Every run is a CPU-bound native process; bound them so a burst cannot exhaust the host.
  capacity:
    max-concurrent: 2
    queue-wait-seconds: 20

# Per-client limits on slicer starts. Cache hits are free. State is in-memory: a restart resets it.
rate-limit:
  enabled: true
  per-minute: 10
  per-hour: 100
  # Only enable behind a reverse proxy that overwrites X-Forwarded-For.
  trust-forwarded-headers: false
  support-email: ${SUPPORT_EMAIL:}

# Owner login for /api/admin/** (HTTP Basic over TLS). A blank password disables the admin API.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}

# What the print farm stocks (from the supplier invoices, 2026-10). Colour does not change
# the slice or the price; it is passed through to the order. A back-office will replace this
# block later.
catalog:
  colors:
    PLA:
      - { code: black, label: Charcoal Black (matt), hex: "#2b2b2b" }
      - { code: white, label: Cotton White (matt), hex: "#f1ede3" }
      - { code: gold, label: Gold, hex: "#d4a017" }
      - { code: green, label: Green, hex: "#1f9d4a" }
      - { code: red, label: Red, hex: "#d62828" }
      - { code: blue, label: Blue, hex: "#1f4fd6" }
      - { code: silk-neon-city, label: Silk Neon City (pink / violet / blue), hex: "#c94fb4" }
      - { code: silk-blue-hawaii, label: Silk Blue Hawaii (cyan / green), hex: "#35b8c6" }
    PETG:
      - { code: black, label: Black, hex: "#1f1f1f" }
      - { code: white, label: White, hex: "#f2f2f2" }
    PCTG:
      - { code: transparent, label: Transparent, hex: "#dde8ef" }

# Pricing inputs for /api/quotes. Mass is derived from filament length x density.
quote:
  currency: CHF
  setup-fee-chf: 5.00
  machine-rate-chf-per-hour: 4.00
  min-unit-price-chf: 3.00
  print-hours-per-day: 16
  filament-diameter-mm: 1.75
  # All copies are sliced as one arranged batch; slicing takes roughly one second per copy.
  max-quantity: 20
  # Finished quotes keyed by model hash and parameters, so repeated requests skip the slicer.
  cache:
    max-entries: 256
    ttl-minutes: 60
  # Customer price per kilogram: purchase price incl. supplier shipping, waste and margin.
  # Purchase prices 2026-10: PolyTerra PLA 14.82, Bambu PLA Basic 25.50, PLA Silk 27.50,
  # PolyLite PETG 29.50, Fiberlogy PCTG 25.81 to 36.67 (CHF/kg, before shipping).
  material-price-chf-per-kg:
    PLA: 36.00
    PETG: 45.00
    PCTG: 55.00

# Commercial settings for orders. Money is stored on the order when it is placed; changing
# these values affects new orders only.
orders:
  shipping-flat-chf: 9.00
  # The business is not VAT registered yet; switch on and prices are treated as VAT inclusive.
  vat-enabled: false
  vat-rate: 0.081
  quote-validity-days: 14
  retention-days: 90
  # Nightly sweep that erases model files and personal data once retention has ended.
  retention-cron: "0 30 3 * * *"
  files-dir: ${ORDER_FILES_DIR:./data/order-files}
  ship-to-countries: [CH]

# API contract. The JSON spec is always on; the browsable UI can be switched off in production.
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /api-docs
    enabled: ${SWAGGER_UI_ENABLED:true}
    operations-sorter: alpha
    tags-sorter: alpha
  packages-to-scan: com.slicercore

# Order mails: confirmation and shipping notice to the customer, a copy of each paid order to
# the owner. Off by default; then the texts are logged instead of sent.
notifications:
  enabled: ${MAIL_ENABLED:false}
  from: ${MAIL_FROM:info@3dburg.ch}
  owner-email: ${OWNER_EMAIL:}
  shop-name: 3DBurg
  shop-url: ${PUBLIC_BASE_URL:http://localhost:4200}

# Hosted payment. "mock" simulates the redirect-and-confirm flow inside the shop until the
# Stripe account is live; switch to "stripe" with the keys set (roadmap phase 4).
payments:
  provider: ${PAYMENT_PROVIDER:mock}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
