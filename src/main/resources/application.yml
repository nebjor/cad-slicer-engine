server:
  port: 8080

spring:
  application:
    name: cad-slicer-engine
  threads:
    virtual:
      enabled: true # Enable Java 21 Virtual Threads for Spring tasks

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  # Every credential comes from the environment; the defaults only match the local Compose stack.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slicercore}
    username: ${DB_USERNAME:sliceruser}
    password: ${DB_PASSWORD:slicerpassword}
    driver-class-name: org.postgresql.Driver

  # Flyway owns the schema (src/main/resources/db/migration); Hibernate only validates it.
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Custom Application Config
slicer:
  # Headless slicing needs no X server, see docs/feasibility/bambu-studio-cli-headless.md (V1)
  binary-path: ${SLICER_BINARY_PATH:bambu-studio-cli}
  timeout-seconds: 120
  # Profiles bundled inside the extracted Bambu Studio AppImage
  profiles-dir: "/opt/bambu/squashfs-root/resources/profiles/BBL"
  machine-profile: "Bambu Lab A1 0.4 nozzle"
  # Build plate used for validation; the Cool Plate default rejects PETG.
  bed-type: "Textured PEI Plate"
  # Every run is a CPU-bound native process; bound them so a burst cannot exhaust the host.
  capacity:
    max-concurrent: 2
    queue-wait-seconds: 20

# Per-client limits on slicer starts. Cache hits are free. State is in-memory: a restart resets it.
rate-limit:
  enabled: true
  per-minute: 10
  per-hour: 100
  # Only enable behind a reverse proxy that overwrites X-Forwarded-For.
  trust-forwarded-headers: false
  support-email: ${SUPPORT_EMAIL:}

# Owner login for /api/admin/** (HTTP Basic over TLS). A blank password disables the admin API.
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:}

# What the print farm stocks. Colour does not change the slice or the price; it is passed
# through to the order. A back-office will replace this block later.
catalog:
  colors:
    PLA:
      - { code: black, label: Black, hex: "#1f1f1f" }
      - { code: white, label: White, hex: "#f2f2f2" }
      - { code: red, label: Red, hex: "#d62828" }
      - { code: green, label: Green, hex: "#2a9d8f" }
    PETG:
      - { code: black, label: Black, hex: "#1f1f1f" }
      - { code: white, label: White, hex: "#f2f2f2" }

# Pricing inputs for /api/quotes. Mass is derived from filament length x density.
quote:
  currency: CHF
  setup-fee-chf: 5.00
  machine-rate-chf-per-hour: 4.00
  min-unit-price-chf: 3.00
  print-hours-per-day: 16
  filament-diameter-mm: 1.75
  # All copies are sliced as one arranged batch; slicing takes roughly one second per copy.
  max-quantity: 20
  # Finished quotes keyed by model hash and parameters, so repeated requests skip the slicer.
  cache:
    max-entries: 256
    ttl-minutes: 60
  material-price-chf-per-kg:
    PLA: 35.00
    PETG: 42.00

# Commercial settings for orders. Money is stored on the order when it is placed; changing
# these values affects new orders only.
orders:
  shipping-flat-chf: 9.00
  # The business is not VAT registered yet; switch on and prices are treated as VAT inclusive.
  vat-enabled: false
  vat-rate: 0.081
  quote-validity-days: 14
  retention-days: 90
  files-dir: ${ORDER_FILES_DIR:./data/order-files}
  ship-to-countries: [CH]

# Hosted payment. "mock" simulates the redirect-and-confirm flow inside the shop until the
# Stripe account is live; switch to "stripe" with the keys set (roadmap phase 4).
payments:
  provider: ${PAYMENT_PROVIDER:mock}
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
