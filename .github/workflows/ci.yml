name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The unit tests imitate the Bambu Studio CLI with a shell script, so no slicer, database
      # or message broker is needed here. Real-slicer checks belong in a separate, tagged job.
      - name: Build and run tests
        run: ./mvnw -B --no-transfer-progress verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          if-no-files-found: ignore

      # Written by OpenApiContractTest; the frontend generates its TypeScript models from it.
      - name: Upload OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: target/openapi.json
          if-no-files-found: ignore
