services:
  # Database. Credentials match the application.yml defaults and .env.example.
  # The full local stack with the slicer CLI lives in the pod-frontend repository.
  postgres:
    image: postgres:16-alpine
    container_name: slicer-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-slicercore}
      POSTGRES_USER: ${DB_USERNAME:-sliceruser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-slicerpassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sliceruser} -d ${DB_NAME:-slicercore}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
